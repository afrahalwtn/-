name: Test preview login
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/security-stability-ui-hardening]
    paths:
      - "server.ts"
      - "web/api.js"
      - "web/app.js"
      - "web/admin-app.js"
      - "web/admin.html"
      - "web/staff-portal.css"
      - "web/arabic-search.js"
      - "web/index.html"
      - "web/tabler-afrah.css"
      - "web/koa-theme.css"
      - "web/afrah-clean.css"
      - "web/afrah-layout-v5.css"
      - "web/icons.js"
      - "package.json"
      - "tests/auth-preview-smoke.mjs"
      - "tests/portal-credentials.mjs"
      - "web/account-portal.css"
      - "web/afrah-stability.css"
      - "web/afrah-brand-2026.css"
      - "web/admin.html"
      - "web/index.html"
      - "web/portal-handoff.js"
      - "tests/arabic-search.mjs"
      - "storage.ts"
      - "passwords.ts"
      - "tests/sqlite-persistence.mjs"
      - "tests/sqlite-server-restart.mjs"
      - "tests/ui-browser-smoke.mjs"
      - "tests/security-hardening.mjs"
      - ".github/workflows/auth-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Arabic letter variations on 10000 simulated products
        run: node tests/arabic-search.mjs
      - name: Test persistent SQLite database with 4200 product records
        run: node --import tsx tests/sqlite-persistence.mjs
      - name: Test real server restart with SQLite file
        run: node tests/sqlite-server-restart.mjs
      - name: Compile TypeScript server
        run: npm run build
      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/admin-app.js
          node --check web/portal-handoff.js
          node --check web/icons.js
      - name: Verify manually editable credentials and secure portal switching
        run: node tests/portal-credentials.mjs
      - name: Verify login with blocked cookies
        run: node tests/auth-preview-smoke.mjs
      - name: Security regression checks
        run: node tests/security-hardening.mjs
      - name: Verify homepage and multi-item receipt in Chrome
        run: node tests/ui-browser-smoke.mjs
      - name: Attach mobile, iPad and desktop previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: afrah-ui-previews
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
