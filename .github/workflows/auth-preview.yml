name: Test preview login
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/security-stability-ui-hardening]
    paths:
      - "server.ts"
      - "web/api.js"
      - "web/app.js"
      - "web/admin-app.js"
      - "web/admin.html"
      - "web/staff-portal.css"
      - "web/arabic-search.js"
      - "web/index.html"
      - "web/tabler-afrah.css"
      - "web/koa-theme.css"
      - "web/afrah-clean.css"
      - "web/afrah-layout-v5.css"
      - "web/icons.js"
      - "package.json"
      - "tests/auth-preview-smoke.mjs"
      - "tests/portal-credentials.mjs"
      - "web/account-portal.css"
      - "web/afrah-stability.css"
      - "web/offline-vault.js"
      - "web/offline-register.js"
      - "web/service-worker.js"
      - "web/manifest.webmanifest"
      - "tests/offline-pwa-smoke.mjs"
      - "web/afrah-brand-2026.css"
      - "web/admin.html"
      - "web/index.html"
      - "web/portal-handoff.js"
      - "tests/arabic-search.mjs"
      - "tests/safari-numeric.mjs"
      - "web/numeric-input.js"
      - "storage.ts"
      - "passwords.ts"
      - "tests/sqlite-persistence.mjs"
      - "tests/sqlite-server-restart.mjs"
      - "tests/ui-browser-smoke.mjs"
      - "tests/security-hardening.mjs"
      - "tests/concurrent-load.mjs"
      - "image-guard.ts"
      - "tests/image-dimensions.mjs"
      - "tests/negative-mutation-matrix.mjs"
      - "tests/media-backpressure.mjs"
      - "web/api.js"
      - ".github/workflows/auth-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Safari/Arabic numeric input parsing
        run: node tests/safari-numeric.mjs
      - name: Test Arabic letter variations on 10000 simulated products
        run: node tests/arabic-search.mjs
      - name: Validate uploaded image dimensions against memory bombs
        run: node --import tsx tests/image-dimensions.mjs
      - name: Test five-at-a-time image download backpressure
        run: node tests/media-backpressure.mjs
      - name: Test persistent SQLite database with 4200 product records
        run: node --import tsx tests/sqlite-persistence.mjs
      - name: Test real server restart with SQLite file
        run: node tests/sqlite-server-restart.mjs
      - name: Stress concurrent writes, reads and staff permissions on isolated SQLite
        run: node tests/concurrent-load.mjs
      - name: Exercise malformed inputs, CSRF and failed-write integrity
        run: node tests/negative-mutation-matrix.mjs
      - name: Compile TypeScript server
        run: npm run build
      - name: Check frontend syntax
        run: |
          node --check web/offline-vault.js
          node --check web/offline-register.js
          node --check web/service-worker.js
          node --check web/numeric-input.js
          node --check web/app.js
          node --check web/admin-app.js
          node --check web/portal-handoff.js
          node --check web/icons.js
      - name: Verify manually editable credentials and secure portal switching
        run: node tests/portal-credentials.mjs
      - name: Verify login with blocked cookies
        run: node tests/auth-preview-smoke.mjs
      - name: Security regression checks
        run: node tests/security-hardening.mjs
      - name: Verify homepage and multi-item receipt in Chrome
        run: |
          # Existing Chrome smoke test still targets the former number editor.
          # Keep the same interactions while using the new Safari-safe selector.
          sed -i 's/type="number"/inputmode="numeric"/g' tests/ui-browser-smoke.mjs
          node tests/ui-browser-smoke.mjs
      - name: Test opt-in encrypted PWA and offline drafts with reconnection
        run: node tests/offline-pwa-smoke.mjs
      - name: Attach mobile, iPad and desktop previews
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: afrah-ui-previews
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
