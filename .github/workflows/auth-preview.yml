name: Test preview login
on:
  push:
    branches: [main]
    paths:
      - "server.ts"
      - "web/api.js"
      - "web/app.js"
      - "web/index.html"
      - "web/tabler-afrah.css"
      - "web/koa-theme.css"
      - "web/afrah-clean.css"
      - "web/icons.js"
      - "package.json"
      - "tests/auth-preview-smoke.mjs"
      - "tests/ui-browser-smoke.mjs"
      - ".github/workflows/auth-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check frontend syntax
        run: |
          node --check web/app.js
          node --check web/icons.js
      - name: Verify login with blocked cookies
        run: node tests/auth-preview-smoke.mjs
      - name: Verify homepage and multi-item receipt in Chrome
        run: node tests/ui-browser-smoke.mjs
