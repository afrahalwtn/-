name: Verify Supabase cloud connection (no real secrets)
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/supabase-cloud-connection
      - feature/arabic-usernames-remember-login
      - feature/security-stability-ui-hardening
      - feature/owner-admin-password-recovery
      - main
    paths:
      - cloud.ts
      - scripts/backup-cloud.mjs
      - tests/independent-backup.mjs
      - .github/workflows/independent-backup.yml
      - server.ts
      - storage.ts
      - tests/supabase-cloud-smoke.mjs
      - .github/workflows/supabase-cloud.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: TypeScript compile
        run: npm run build
      - name: Cloud storage and authorization smoke
        run: node tests/supabase-cloud-smoke.mjs
      - name: Verify independent encrypted snapshot and offline extraction
        run: node tests/independent-backup.mjs
      - name: Ensure legacy local storage still works
        run: node tests/sqlite-server-restart.mjs
